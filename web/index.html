<!DOCTYPE html>
<html>
    <head>
        <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
        <base href="$FLUTTER_BASE_HREF" />

        <meta charset="UTF-8" />
        <meta name="description" content="PWA Counter built with Flutter" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- PWA manifest -->

        <!-- Theme color -->
        <meta name="theme-color" content="#1976D2" />

        <!-- iOS PWA support -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="PWA Counter" />

        <!-- Apple touch icons (placed in web/icons/) -->
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="icons/apple-touch-icon.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="152x152"
            href="icons/Icon-152.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="120x120"
            href="icons/Icon-120.png"
        />

        <!-- Fallback favicon -->
        <link rel="icon" type="image/png" href="icons/favicon.png" />

        <title>dashboard</title>
        <link rel="manifest" href="manifest.json" />
    </head>
    <body>
        <script src="flutter_bootstrap.js" async></script>
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    navigator.serviceWorker
                        .register("flutter_service_worker.js")
                        .then(function (reg) {
                            console.log(
                                "ServiceWorker registration succeeded. Scope: ",
                                reg.scope
                            );
                        })
                        .catch(function (err) {
                            console.warn(
                                "ServiceWorker registration failed: ",
                                err
                            );
                        });
                });
            }
        </script>
    </body>
</html>
